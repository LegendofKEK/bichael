[package]
name = "lok-engine"
version = "0.1.0"
edition = "2021"
description = "Bellgrave lok engine, first slice: state, canonical keccak, genesis, hash-chained log"
license = "MIT"
publish = false

[[bin]]
name = "lok-replay"
path = "src/bin/lok-replay.rs"

[dependencies]
hex = "0.4"
serde_json = "1"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
